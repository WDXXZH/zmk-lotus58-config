---
include:
  # 左手：中枢（central）+ 旋钮（EC11）。nRFMicro 1.3/1.4 用 nrfmicro_13，
  # 1.1/1.2 改成 nrfmicro_11，反装/镜像用 nrfmicro_11_flipped。
  - board: nrfmicro_13
    shield: lotus58_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # 右手：外设（peripheral）+ 0.91" OLED
  - board: nrfmicro_13
    shield: lotus58_right
  # 配对/换板后先刷它清 settings
  - board: nrfmicro_13
    shield: settings_reset
