---
include:
  # ---------------------------------------------------------------
  # Dongle（中枢）：nice!nano v2 克隆 + 0.96" OLED
  # 负责键位解析、USB/BLE 输出、ZMK Studio
  # ---------------------------------------------------------------
  - board: nice_nano_v2
    shield: lotus58_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # ---------------------------------------------------------------
  # 左手：外设（peripheral）+ 旋钮
  # ---------------------------------------------------------------
  - board: nrfmicro_13
    shield: lotus58_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: lotus58_left_peripheral

  # ---------------------------------------------------------------
  # 右手：外设（peripheral）+ 0.91" OLED
  # ---------------------------------------------------------------
  - board: nrfmicro_13
    shield: lotus58_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: lotus58_right_peripheral

  # ---------------------------------------------------------------
  # 配对/换板后先刷它清 settings（三块板各刷一次）
  # ---------------------------------------------------------------
  - board: nice_nano_v2
    shield: settings_reset
  - board: nrfmicro_13
    shield: settings_reset
