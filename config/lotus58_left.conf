# 左手：中枢 + 旋钮
# 旋钮占用 pro_micro 20/21（与 OLED 的 I2C 同脚），所以这一侧不能开 CONFIG_ZMK_DISPLAY。
CONFIG_ZMK_KEYBOARD_NAME="Lotus58"
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_STUDIO=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 每键 RGB（每半 29 颗 SK6812 mini-E，只接 per-key 链）
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# 不要让 RGB 开关联动 VCC，否则关灯会连 OLED 一起断电
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
# 亮度硬上限 20%，避免 29 颗灯珠把 600mA LDO 拉满
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
