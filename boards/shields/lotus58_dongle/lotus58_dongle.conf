# Lotus58 USB dongle（nice!nano v2 + 0.96" OLED）
# 中枢：负责键位解析、USB/BLE 输出、ZMK Studio
CONFIG_ZMK_KEYBOARD_NAME="Lotus58"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# dongle 全程 USB 供电，不需要省电睡眠
CONFIG_ZMK_SLEEP=n

# dongle 上没有 LED 灯链
CONFIG_ZMK_RGB_UNDERGLOW=n

# 0.96" 128x64 OLED 状态屏
CONFIG_ZMK_DISPLAY=y
# dongle 没有电池，隐藏电量 widget
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
# 显示最高激活层（只有 central 能显示层名）
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# 显示 USB/BLE 输出状态
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
# 打字速度
CONFIG_ZMK_WIDGET_WPM_STATUS=y
